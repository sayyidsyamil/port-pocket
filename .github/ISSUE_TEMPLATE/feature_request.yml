name: Feature request
description: Suggest a focused improvement
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult with the current app?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed improvement
      description: Describe the smallest useful change.
    validations:
      required: true
