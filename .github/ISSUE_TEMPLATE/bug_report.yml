name: Bug report
description: Report a reproducible problem
title: "Bug: "
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac architecture, and Port Pocket version or commit
      placeholder: macOS 15, Apple silicon, v0.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproducible example. Remove private paths and credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or relevant output
      description: Optional. Redact personal paths and sensitive process information.
